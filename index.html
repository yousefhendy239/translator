<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Document</title>
</head>

<body>
    <section class="vh-100 d-flex justify-content-center align-items-center bg-secondary">
        <div class="w-100 bg-black p-4 d-flex flex-column justify-content-center align-items-center gap-4">
            <h1 class="text-center text-light">Translator App</h1>
            <div class="d-flex justify-content-center align-items-center gap-3">
                <div class="d-flex flex-column gap-3 ">
                    <textarea cols="20" rows="10"
                        class="bg-secondary rounded-2 p-3 border-1 border-light text-light textAreaTranslate"></textarea>
                    <select class="bg-dark text-light p-1 selectLanguageTranslate">
                        <option value="en-GB">English</option>
                        <option value="ar-SA">Arabic</option>
                        <option value="de-DE">German</option>
                        <option value="es-ES">Spanish</option>
                        <option value="it-IT">Italian</option>
                    </select>
                </div>
                <div class="d-flex flex-column gap-3">
                    <textarea cols="20" rows="10" disabled
                        class="bg-dark rounded-2 p-3 border-1 border-light text-light textAreaTranslatedTo"></textarea>
                    <select class="bg-dark text-light p-1 selectLanguageTranslateTo">
                        <option value="ar-SA">Arabic</option>
                        <option value="en-GB">English</option>
                        <option value="de-DE">German</option>
                        <option value="es-ES">Spanish</option>
                        <option value="it-IT">Italian</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-outline-primary">Translate</button>
        </div>
    </section>




    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
